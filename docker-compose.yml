version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: feedflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-feedflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-feedflow_password}
      POSTGRES_DB: ${DB_DATABASE:-feedflow_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-feedflow}']
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: feedflow_n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Shanghai
      - N8N_BASIC_AUTH_ACTIVE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_DATABASE:-feedflow_db}
      - DB_POSTGRESDB_USER=${DB_USERNAME:-feedflow}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-feedflow_password}
      - DB_POSTGRESDB_SCHEMA=n8n
    ports:
      - '5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
